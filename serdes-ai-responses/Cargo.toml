[package]
name = "serdes-ai-responses"
description = "OpenAI Responses API (Open Responses) server for serdesAI models"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["ai", "llm", "agent", "responses", "server"]
categories = ["api-bindings", "network-programming"]
readme = "README.md"

[features]
default = []
server = ["dep:axum", "dep:tower", "dep:http-body"]

[dependencies]
serdes-ai-core = { workspace = true }
serdes-ai-models = { workspace = true }
serdes-ai-tools = { workspace = true }

async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }

# HTTP server (optional)
axum = { version = "0.8", optional = true, features = ["ws"] }
tower = { version = "0.5", optional = true }
http-body = { version = "1", optional = true }

[dev-dependencies]
tokio-test = { workspace = true }
rstest = { workspace = true }
pretty_assertions = { workspace = true }
tokio-tungstenite = "0.21"
reqwest = { workspace = true }
